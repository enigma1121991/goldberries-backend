services:
  backend:
    build: .
    container_name: backend
    user: "${UID}:${GID}"
    ports:
      - "${BACKEND_PORT:-80}:80"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  cron:
    build: .
    container_name: backend-cron
    # crond needs root to create /var/run/crond.pid; the cronfile drops each job to www-data
    user: "0:0"
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      - db
    command: ["cron", "-f"]

  db:
    image: postgres:17
    container_name: postgres
    command: -c random_page_cost=1.1 -c shared_buffers=512MB -c effective_cache_size=1536MB
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${GB_DBNAME}
      POSTGRES_USER: ${GB_DBUSER}
      POSTGRES_PASSWORD: ${GB_DBPASS}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./data:/tmp/goldberries-data
      - ./data/restore-backup.sh:/docker-entrypoint-initdb.d/restore-backup.sh:ro
    restart: unless-stopped

volumes:
  postgres-data:
